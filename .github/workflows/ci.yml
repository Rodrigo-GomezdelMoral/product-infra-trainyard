name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the pinned tools
        run: pip install -r requirements-dev.txt

      - name: Lint, format, types, tests and budget
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Build the demo with the e2e runs, without a backend
        env:
          VITE_DEMO_MODE: "true"
        run: |
          mkdir -p src/demo/runs
          cp e2e/runs.json src/demo/runs/e2e.json
          npx vite build

      - run: npx playwright install --with-deps chromium

      - name: Keyboard-only flows and axe on the demo build
        run: npm test
