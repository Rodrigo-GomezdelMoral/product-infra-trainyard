name: ship
description: >-
  Deploy one image digest and the infrastructure to an environment, keep the endpoint's traffic as it is, smoke-test
  the app, register the ML components with the image's version, run a fleet feed operation if one is asked for, submit
  the training pipeline if asked, and trigger the staging monitor if asked.
  The calling job sets ENVIRONMENT, RG, IMAGE_DIGEST, IMAGE_VERSION, AUTH_CLIENT_ID, ALERT_EMAIL_ADDRESS and the
  shared-base names, and is signed in to Azure.

inputs:
  feed-days:
    description: Days of synthetic feed from 2025-11-01 to register as a new fleet-feed version (ADR-012); empty for none
    required: false
    default: ""
  firmware-b-from:
    description: Date from which the firmware-b scenario shifts Series B; empty for none
    required: false
    default: ""
  train:
    description: "true submits the training pipeline with this image's components on the latest fleet feed (REQ-02)"
    required: false
    default: "false"
  monitor:
    description: "true runs the monitor schedule once, which staging has instead of a daily run (ADR-010)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Read the endpoint's live and mirrored traffic, so that the deployment never moves them
      shell: bash
      run: |
        short="$([ "$ENVIRONMENT" = production ] && echo prod || echo stg)"
        if ! live="$(az resource show -g "$RG" -n "mlw-trainyard-$short-swc/onlineEndpoints/ep-trainyard-$short" -o json \
          --resource-type Microsoft.MachineLearningServices/workspaces/onlineEndpoints --query properties 2>"$RUNNER_TEMP/endpoint.err")"; then
          grep -q ResourceNotFound "$RUNNER_TEMP/endpoint.err" || { cat "$RUNNER_TEMP/endpoint.err"; exit 1; }
          live='{}'
        fi
        if jq -e '.provisioningState == "Failed" and (.traffic // {}) == {} and (.mirrorTraffic // {}) == {}' <<<"$live" >/dev/null; then
          echo "::error::The endpoint's creation failed and Azure ML accepts no update to it: see 'A failed endpoint' in docs/OPERATIONS.md"; exit 1
        fi
        echo "ENDPOINT_TRAFFIC=$(jq -c '.traffic // {}' <<<"$live")" >> "$GITHUB_ENV"
        echo "ENDPOINT_MIRROR_TRAFFIC=$(jq -c '.mirrorTraffic // {}' <<<"$live")" >> "$GITHUB_ENV"

    - name: What-if, then deploy
      shell: bash
      run: |
        az deployment group what-if -g "$RG" -n trainyard -p infra/main.bicepparam --result-format ResourceIdOnly --only-show-errors
        deploy() {
          az deployment group create -g "$RG" -n trainyard -p infra/main.bicepparam --only-show-errors \
            --query properties.outputs -o json > "$RUNNER_TEMP/outputs.json"
        }
        deploy || { echo "::warning::Deployment failed; one retry in 10 minutes, the time Learn gives a new role assignment to take effect"; sleep 600; deploy; }
        identity="$(jq -r .amlIdentityClientId.value "$RUNNER_TEMP/outputs.json")"
        echo "::add-mask::$identity"
        echo "APP=$(jq -r .app.value "$RUNNER_TEMP/outputs.json")" >> "$GITHUB_ENV"
        echo "WORKSPACE=$(jq -r .workspace.value "$RUNNER_TEMP/outputs.json")" >> "$GITHUB_ENV"
        echo "ENDPOINT=$(jq -r .endpoint.value "$RUNNER_TEMP/outputs.json")" >> "$GITHUB_ENV"
        echo "AML_IDENTITY=$identity" >> "$GITHUB_ENV"

    - name: Smoke test, through Easy Auth's excluded health path
      shell: bash
      run: |
        fqdn="$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
        echo "::add-mask::$fqdn"
        echo "::add-mask::${fqdn#*.}"
        curl -fsS -o /dev/null -w "/healthz %{http_code} %{time_total} s\n" --retry 12 --retry-delay 10 --retry-all-errors "https://$fqdn/healthz"

    - name: Register the ML components with the image's version
      shell: bash
      run: |
        az extension add --name ml --version 2.45.2 --yes --only-show-errors
        for spec in ml/components/*.yaml; do
          name="$(basename "$spec" .yaml)"
          az ml component show -n "$name" -v "$IMAGE_VERSION" -g "$RG" -w "$WORKSPACE" -o none --only-show-errors 2>/dev/null ||
            az ml component create -f "$spec" --set version="$IMAGE_VERSION" -g "$RG" -w "$WORKSPACE" -o none --only-show-errors
          echo "$name $IMAGE_VERSION registered"
        done

    - if: inputs.feed-days != '' || inputs.train == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Fleet feed operation (ADR-012)
      if: inputs.feed-days != ''
      shell: bash
      env:
        FEED_DAYS: ${{ inputs.feed-days }}
        FIRMWARE_B_FROM: ${{ inputs.firmware-b-from }}
      run: |
        pip install --quiet $(grep -h -E '^(numpy|pandas|pyarrow)==' requirements.txt requirements-dev.txt)
        python -m ops.feed --out "$RUNNER_TEMP/feed" --start 2025-11-01 --days "$FEED_DAYS" ${FIRMWARE_B_FROM:+--firmware-b-from "$FIRMWARE_B_FROM"}
        version="$(date -u +%Y%m%d%H%M%S)"
        az ml data create -n fleet-feed -v "$version" --type uri_folder --path "$RUNNER_TEMP/feed" -g "$RG" -w "$WORKSPACE" -o none --only-show-errors \
          --description "Synthetic feed from 2025-11-01, $FEED_DAYS days, firmware-b from ${FIRMWARE_B_FROM:-never}, run $GITHUB_RUN_ID"
        echo "fleet-feed $version registered: $FEED_DAYS days, firmware-b from ${FIRMWARE_B_FROM:-never}"

    - name: Submit the training pipeline (REQ-02)
      if: inputs.train == 'true'
      shell: bash
      run: |
        pip install --quiet $(grep -h -E '^(azure-ai-ml|azure-identity)==' requirements.txt)
        python -m ops.train --subscription "$(az account show --query id -o tsv)" --group "$RG" --workspace "$WORKSPACE"           --endpoint "$ENDPOINT" --version "$IMAGE_VERSION" --identity "$AML_IDENTITY"

    - name: Run the monitor once (ADR-010)
      if: inputs.monitor == 'true'
      shell: bash
      run: |
        if az ml schedule show -n trainyard-monitor -g "$RG" -w "$WORKSPACE" -o none --only-show-errors 2>/dev/null; then
          az ml schedule trigger -n trainyard-monitor -g "$RG" -w "$WORKSPACE" -o none --only-show-errors
          echo "trainyard-monitor triggered"
        else
          echo "No monitor yet: it is created when a model first serves 100 %"
        fi
