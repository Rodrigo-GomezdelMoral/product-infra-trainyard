[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "BLE", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
files = ["."]
exclude = ["^\\.venv/", "^web/", "^\\.local/"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "azureml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore::marshmallow.warnings.Marshmallow4Warning",
    "ignore::DeprecationWarning:mlflow",
    "ignore:.*Any type hint is inferred as AnyType:UserWarning",
]
